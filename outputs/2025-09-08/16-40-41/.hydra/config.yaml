  - 80.0
  - 50.0
  - 50.0
  - 30.0
  - 30.0
  - 80.0
  - 80.0
  - 50.0
  - 50.0
  - 30.0
  - 30.0
  heading_weight: 1.5
  up_weight: 1.0
  energy_cost_scale: 0.002
  actions_cost_scale: 0.001
  alive_reward_scale: 1.0
  dof_vel_scale: 0.1
  joint_pos_weight: 1.0
  vel_penalty_scale: 0.05
  long_stand_bonus: 1.0
  death_cost: -20.0
  termination_height: 0.25
  angular_velocity_scale: 0.5
  contact_force_scale: 0.1
  action_scale: 0.5
