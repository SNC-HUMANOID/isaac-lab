    class_type: isaaclab.terrains.terrain_importer:TerrainImporter
    collision_group: -1
    prim_path: /World/ground
    num_envs: 1
    terrain_type: plane
    terrain_generator: null
    usd_path: null
    env_spacing: null
    visual_material:
      func: isaaclab.sim.spawners.materials.visual_materials:spawn_preview_surface
      diffuse_color:
      - 0.0
      - 0.0
      - 0.0
      emissive_color:
      - 0.0
      - 0.0
      - 0.0
      roughness: 0.5
      metallic: 0.0
      opacity: 1.0
    physics_material:
      func: isaaclab.sim.spawners.materials.physics_materials:spawn_rigid_body_material
      static_friction: 1.0
      dynamic_friction: 1.0
      restitution: 0.0
      improve_patch_friction: true
      friction_combine_mode: average
      restitution_combine_mode: average
      compliant_contact_stiffness: 0.0
      compliant_contact_damping: 0.0
    max_init_terrain_level: null
    debug_vis: false
agent:
  seed: 42
  device: cuda:0
  num_steps_per_env: 128
  max_iterations: 3000
  empirical_normalization: false
  policy:
    class_name: ActorCritic
    init_noise_std: 0.3
    noise_std_type: scalar
    actor_hidden_dims:
    - 512
    - 256
    - 128
    critic_hidden_dims:
    - 512
    - 256
    - 128
    activation: elu
  algorithm:
    class_name: PPO
    num_learning_epochs: 8
    num_mini_batches: 8
    learning_rate: 0.0002
    schedule: adaptive
    gamma: 0.995
    lam: 0.98
    entropy_coef: 0.02
    desired_kl: 0.01
    max_grad_norm: 1.0
    value_loss_coef: 0.5
    use_clipped_value_loss: true
    clip_param: 0.15
    normalize_advantage_per_mini_batch: false
    symmetry_cfg: null
    rnd_cfg: null
  clip_actions: null
  save_interval: 25
  experiment_name: humanoid_snc_direct_optimized
  run_name: ''
  logger: tensorboard
  neptune_project: isaaclab
  wandb_project: isaaclab
  resume: false
  load_run: .*
  load_checkpoint: model_.*.pt
